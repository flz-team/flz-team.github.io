<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FLZ — Rust-сообщество</title>
<meta name="description" content="FLZ — сообщество игроков в Rust: тиммейты, рейды, ивенты, турниры. Все ссылки в одном месте.">
<meta property="og:title" content="FLZ — Rust-сообщество">
<meta property="og:description" content="Тиммейты, рейды, ивенты и турниры. Telegram, Discord, TikTok.">
<meta property="og:image" content="logo.png">
<meta name="theme-color" content="#18191d">
<link rel="icon" href="logo.png">
<style>
:root{--bg:#18191d;--card:#212228;--card2:#2a2b32;--line:#33343c;--text:#f2f3f5;--muted:#9a9ca5;--red:#ed4245}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;justify-content:center;padding:48px 16px 40px;
 background:radial-gradient(600px 380px at 50% -80px,rgba(237,66,69,.16),transparent 70%),var(--bg)}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
.logo{width:104px;height:104px;border-radius:50%;border:2px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{margin-top:18px;font-size:30px;font-weight:800;letter-spacing:.06em}
.bar{width:44px;height:4px;background:var(--red);border-radius:2px;margin:10px 0 12px}
.tag{color:var(--muted);font-size:15px;text-align:center;line-height:1.45}
.links{width:100%;margin-top:28px;display:flex;flex-direction:column;gap:12px}
a.l{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--card);border:1px solid var(--line);
 border-radius:14px;color:var(--text);text-decoration:none;transition:transform .15s,border-color .15s,background .15s}
a.l:hover,a.l:focus-visible{transform:translateY(-2px);border-color:var(--red);background:var(--card2);outline:none}
a.l:active{transform:scale(.98)}
.ic{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center}
.ic svg{width:22px;height:22px;fill:#fff}
.t{flex:1;min-width:0}
.t b{display:block;font-size:16px;font-weight:700}
.t span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.arr{color:var(--muted);font-size:20px}
.main{border-color:rgba(237,66,69,.55)}
.main .arr{color:var(--red)}
.tg{background:#2aabee}.bot{background:#ed4245}.ds{background:#5865f2}.tt{background:#000;border:1px solid #3a3b42}
.foot{margin-top:30px;color:#5f616a;font-size:12px;text-align:center}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="FLZ" width="104" height="104">
  <h1>FLZ</h1>
  <div class="bar"></div>
  <p class="tag">Сообщество игроков в Rust<br>тиммейты · рейды · ивенты · турниры</p>

  <nav class="links">
    <a class="l main" href="https://t.me/glzTGbot" target="_blank" rel="noopener">
      <span class="ic bot"><svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 1 3.7V7h4a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3h4V5.7A2 2 0 0 1 12 2zM9 12a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM1 12h2v5H1zm20 0h2v5h-2z"/></svg></span>
      <span class="t"><b>Найти тиммейта</b><span>Анкета и профиль в боте</span></span><span class="arr">›</span>
    </a>
    <a class="l" href="https://t.me/flz_team" target="_blank" rel="noopener">
      <span class="ic tg"><svg viewBox="0 0 24 24"><path d="M21.9 4.3 18.7 19.4c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13 1.4 11.5c-1-.3-1-1 .2-1.5L20.5 2.7c.9-.3 1.6.2 1.4 1.6z"/></svg></span>
      <span class="t"><b>Telegram-канал</b><span>Новости, рейды, ивенты</span></span><span class="arr">›</span>
    </a>
    <a class="l" href="https://discord.gg/xHDS2dxWdB" target="_blank" rel="noopener">
      <span class="ic ds"><svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.4 18.4 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.8 19.8 0 0 0 6-3c.5-5.2-.8-9.7-3.6-13.7zM8 15.3c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.5 8 10.5s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg></span>
      <span class="t"><b>Discord-сервер</b><span>Войсы, тимы, мини-игры</span></span><span class="arr">›</span>
    </a>
    <a class="l" href="https://www.tiktok.com/@flz.rust" target="_blank" rel="noopener">
      <span class="ic tt"><svg viewBox="0 0 24 24"><path d="M16.6 2h-3.4v13.4a2.9 2.9 0 1 1-2-2.8V9.2a6.3 6.3 0 1 0 5.4 6.2V8.6a8 8 0 0 0 4.7 1.5V6.7a4.7 4.7 0 0 1-4.7-4.7z"/></svg></span>
      <span class="t"><b>TikTok</b><span>Ролики про Rust</span></span><span class="arr">›</span>
    </a>
  </nav>

  <p class="foot">© FLZ · Rust community</p>
</main>
</body>
</html>
